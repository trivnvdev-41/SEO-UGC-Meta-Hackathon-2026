name: mobile-release (APK manual)

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'API_BASE baked into the APK'
        required: true
        default: 'https://saba.ink'
      web_base:
        description: 'WEB_BASE baked into the APK (share links)'
        required: true
        default: 'https://saba.ink'
      release_name:
        description: 'Release tag (e.g. saba-manual, v1.0.1)'
        required: true
        default: 'saba-manual'

jobs:
  build:
    name: build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_BASE=${{ inputs.api_base }} --dart-define=WEB_BASE=${{ inputs.web_base }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk saba-${{ inputs.release_name }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/saba-*.apk
          tag_name: ${{ inputs.release_name }}
